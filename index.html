<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-language tags — <title>, description, canonical, robots, hreflang,
         Open Graph and Twitter — are rendered by src/seo/Seo.jsx, one set per
         locale. Only what is identical on every language page lives here. -->
    <meta name="author" content="Veli Bol Excursions" />
    <meta name="theme-color" content="#0C1B2B" />

    <!-- Local / geo hints, read by some travel directories and map services -->
    <meta name="geo.region" content="HR-19" />
    <meta name="geo.placename" content="Bol, Brač, Croatia" />
    <meta name="geo.position" content="43.2621;16.6558" />
    <meta name="ICBM" content="43.2621, 16.6558" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts — self-hosted from public/fonts/, declared in src/index.css.
         Preload only the latin halves of the two upright faces the first
         screen uses; latin-ext and the italic load on demand. -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preload the LCP hero image. imagesrcset/imagesizes must mirror the <img>
         in Hero.jsx, or the browser preloads a width it then discards. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-1280.webp"
      imagesrcset="/images/hero-800.webp 800w, /images/hero-1280.webp 1280w, /images/hero.webp 2000w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Structured data is rendered by src/seo/StructuredData.jsx, generated from
         the same data the page renders, and prerendered into the built HTML. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
